name: CI

on:
    pull_request:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: muisnowdevs
                    MYSQL_USER: muisnowdevs
                    MYSQL_PASSWORD: muisnowdevs-local-password
                    MYSQL_ROOT_PASSWORD: root-local-password
                ports: ["3306:3306"]
                options: >-
                    --health-cmd "mysqladmin ping -h localhost -uroot -proot-local-password --silent"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
            redis:
                image: redis:7.4-alpine
                ports: ["6379:6379"]
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            TEST_REDIS_URL: redis://127.0.0.1:6379
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.19.0
            - name: Enable Yarn 1
              run: corepack enable && corepack prepare yarn@1.22.22 --activate
            - run: yarn install --frozen-lockfile --non-interactive
            - name: Prepare test environment
              run: cp .env.example .env
            - run: yarn typecheck
            - run: yarn migrations:apply
            - run: yarn test
            - name: Build container image
              run: docker build --build-arg VITE_PUBLIC_URL=https://media.example.invalid/ --target runtime .

    publish:
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        needs: validate
        runs-on: ubuntu-latest
        concurrency:
            group: ghcr-muisnowdevs-one-node
            cancel-in-progress: false
        permissions:
            contents: read
            packages: write
        env:
            IMAGE_NAME: ghcr.io/muisnow-devs/muisnowdevs.one_node
            PACKAGE_OWNER: Muisnow-Devs
            PACKAGE_NAME: muisnowdevs.one_node
        steps:
            - uses: actions/checkout@v4
            - name: Require the existing package to be private
              uses: actions/github-script@v7
              with:
                  script: |
                      try {
                        const response = await github.request(
                          "GET /orgs/{org}/packages/{package_type}/{package_name}",
                          {
                            org: process.env.PACKAGE_OWNER,
                            package_type: "container",
                            package_name: process.env.PACKAGE_NAME,
                          },
                        );
                        if (response.data.visibility !== "private") {
                          throw new Error("Existing GHCR package must be private before publishing.");
                        }
                      } catch (error) {
                        if (error.status !== 404) throw error;
                      }
            - name: Require the published public-media URL
              env:
                  PUBLIC_MEDIA_URL: ${{ vars.VITE_PUBLIC_URL }}
              run: test -n "$PUBLIC_MEDIA_URL"
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: metadata
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest
                      type=sha,format=long
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  target: runtime
                  push: true
                  platforms: linux/amd64
                  provenance: false
                  sbom: false
                  build-args: |
                      VITE_PUBLIC_URL=${{ vars.VITE_PUBLIC_URL }}
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
            - name: Retain the latest two image versions
              uses: actions/github-script@v7
              with:
                  script: |
                      const versions = await github.paginate(
                        "GET /orgs/{org}/packages/{package_type}/{package_name}/versions",
                        {
                          org: process.env.PACKAGE_OWNER,
                          package_type: "container",
                          package_name: process.env.PACKAGE_NAME,
                          per_page: 100,
                        },
                      );
                      const latestVersion = versions.find((version) =>
                        version.metadata.container.tags.includes("latest"),
                      );
                      if (!latestVersion) {
                        throw new Error("The just-pushed latest image version was not found.");
                      }
                      const retainedVersionIds = new Set([latestVersion.id]);
                      for (const version of versions
                        .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))) {
                        if (retainedVersionIds.size === 2) break;
                        retainedVersionIds.add(version.id);
                      }
                      const obsoleteVersions = versions.filter(
                        (version) => !retainedVersionIds.has(version.id),
                      );
                      for (const version of obsoleteVersions) {
                        await github.request(
                          "DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}",
                          {
                            org: process.env.PACKAGE_OWNER,
                            package_type: "container",
                            package_name: process.env.PACKAGE_NAME,
                            package_version_id: version.id,
                          },
                        );
                      }
