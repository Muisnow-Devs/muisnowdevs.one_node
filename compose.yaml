services:
    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: muisnowdevs
            MYSQL_USER: muisnowdevs
            MYSQL_PASSWORD: muisnowdevs-local-password
            MYSQL_ROOT_PASSWORD: root-local-password
        ports:
            - "127.0.0.1:3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    redis:
        image: redis:7.4-alpine
        command: redis-server --appendonly yes
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 20

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minio
            MINIO_ROOT_PASSWORD: minio-local-password
        ports:
            - "127.0.0.1:9000:9000"
            - "127.0.0.1:9001:9001"
        volumes:
            - minio-data:/data
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
            interval: 5s
            timeout: 5s
            retries: 20

    minio-init:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        restart: "no"
        volumes:
            - ./scripts/minio-cors.xml:/config/minio-cors.xml:ro
        entrypoint: >-
            /bin/sh -c
            "mc alias set local http://minio:9000 minio minio-local-password &&
            mc mb --ignore-existing local/private &&
            mc mb --ignore-existing local/public &&
            mc anonymous set download local/public &&
            mc cors set local/private /config/minio-cors.xml &&
            mc cors set local/public /config/minio-cors.xml"

volumes:
    mysql-data:
    redis-data:
    minio-data:
